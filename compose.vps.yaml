services:
  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://user.bmt.kwiko.org
      TICKET_PUBLIC_ORIGIN: https://user.bmt.kwiko.org
      WEB_ORIGINS: https://admin.bmt.kwiko.org,https://partner.bmt.kwiko.org,https://user.bmt.kwiko.org
  worker:
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://user.bmt.kwiko.org
      TICKET_PUBLIC_ORIGIN: https://user.bmt.kwiko.org
  admin-panel:
    ports: !reset []
  partner-panel:
    ports: !reset []
  customer-web:
    image: nginx:1.28-alpine
    volumes:
      - ./frontend/customer-web:/usr/share/nginx/html:ro
    networks: [platform]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certificates:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
    networks: [platform]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      admin-panel: {condition: service_healthy}
      partner-panel: {condition: service_healthy}
      customer-web: {condition: service_started}
  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/acme
    networks: [platform]
volumes:
  certificates:
  acme:
