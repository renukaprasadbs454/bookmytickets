server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://api:4100;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /ticket/ { proxy_pass $backend; proxy_set_header Host $http_host; }
    location /checkout/ { proxy_pass $backend; proxy_set_header Host $http_host; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

