name: book-my-tickets

x-api: &api
  image: book-my-tickets-api:local
  build:
    context: .
    dockerfile: docker/Platform.Dockerfile
    target: api
  env_file: backend/.env
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    HOST: 0.0.0.0
    PORT: 4100
    STORAGE_ROOT: /app/storage
    NODE_ENV: development
  volumes:
    - ./storage:/app/storage
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [platform]

services:
  postgres:
    image: postgres:16
    container_name: book-my-tickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bmt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  migrate:
    <<: *api
    command: [sh, -c, "npm run migrate && npm run bootstrap"]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *api
    restart: unless-stopped
    ports: ['127.0.0.1:4100:4100']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10

  worker:
    <<: *api
    command: [npm, run, worker]
    environment:
      <<: *api-env
      WORKER_HEARTBEAT_PATH: /tmp/bmt-worker-heartbeat
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/bmt-worker-heartbeat').mtimeMs<60000?0:1)}catch{process.exit(1)}"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    stop_grace_period: 30s

  admin-panel:
    image: book-my-tickets-admin:local
    build:
      context: .
      dockerfile: docker/Platform.Dockerfile
      target: web
      args: {PORTAL: admin-panel}
    restart: unless-stopped
    ports: ['127.0.0.1:5178:8080']
    depends_on:
      api: {condition: service_healthy, restart: true}
    networks: [platform]
    security_opt: [no-new-privileges:true]

  partner-panel:
    image: book-my-tickets-partner:local
    build:
      context: .
      dockerfile: docker/Platform.Dockerfile
      target: web
      args: {PORTAL: partner-panel}
    restart: unless-stopped
    ports: ['127.0.0.1:5179:8080']
    depends_on:
      api: {condition: service_healthy, restart: true}
    networks: [platform]
    security_opt: [no-new-privileges:true]

  test-postgres:
    image: postgres:16
    profiles: [checks]
    environment:
      POSTGRES_USER: bmt_test
      POSTGRES_PASSWORD: isolated-container-tests
      POSTGRES_DB: bmt_test
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bmt_test -d bmt_test']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [checks]

  checks:
    image: book-my-tickets-checks:local
    build:
      context: .
      dockerfile: docker/Platform.Dockerfile
      target: checks
    profiles: [checks]
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql://bmt_test:isolated-container-tests@test-postgres:5432/bmt_test
      APP_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      WEB_ORIGINS: http://127.0.0.1:5178,http://127.0.0.1:5179
    command: [npm, test]
    depends_on:
      test-postgres: {condition: service_healthy}
    networks: [checks]

  backup:
    image: postgres:16
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./storage:/media:ro
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: [sh, /backup.sh]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [platform]

volumes:
  bmt_postgres:
networks:
  platform:
  checks:

