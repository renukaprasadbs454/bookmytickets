server {
 listen 80;
 server_name user.bmt.kwiko.org admin.bmt.kwiko.org partner.bmt.kwiko.org;
 location /.well-known/acme-challenge/ { root /opt/bookmytickets/deploy/acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name user.bmt.kwiko.org admin.bmt.kwiko.org partner.bmt.kwiko.org;
 ssl_certificate /opt/bookmytickets/deploy/certificates/live/bmt/fullchain.pem;
 ssl_certificate_key /opt/bookmytickets/deploy/certificates/live/bmt/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 11m;
 location / {
  proxy_pass http://127.0.0.1:18089;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
