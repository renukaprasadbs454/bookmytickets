server {
 listen 80;
 server_name user.bmt.kwiko.org admin.bmt.kwiko.org partner.bmt.kwiko.org;
 location /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name user.bmt.kwiko.org admin.bmt.kwiko.org partner.bmt.kwiko.org;
 ssl_certificate /etc/letsencrypt/live/bmt/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/bmt/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 11m;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $portal http://customer-web:8080;
 if ($host = admin.bmt.kwiko.org) { set $portal http://admin-panel:8080; }
 if ($host = partner.bmt.kwiko.org) { set $portal http://partner-panel:8080; }
 location /api/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /ticket/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
 location /checkout/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
 location / { proxy_pass $portal; proxy_set_header Host $host; }
}
