server {
 listen 8080;
 server_name user.bmt.kwiko.org admin.bmt.kwiko.org partner.bmt.kwiko.org;
 client_max_body_size 11m;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $portal http://customer-web:80;
 if ($host = admin.bmt.kwiko.org) { set $portal http://admin-panel:8080; }
 if ($host = partner.bmt.kwiko.org) { set $portal http://partner-panel:8080; }
 location /api/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /ticket/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
 location /checkout/ { set $api http://api:4100; proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
 location / { proxy_pass $portal; proxy_set_header Host $host; }
}
