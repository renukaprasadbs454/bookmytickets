<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOK MY TICKETS</title><style>body{margin:0;background:#101014;color:#f5f1ff;font:17px system-ui}main{max-width:1100px;margin:auto;padding:48px 24px}h1{font-size:clamp(40px,7vw,80px);max-width:800px}b,a{color:#b999ff}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}article{background:#211c2c;border-radius:20px;padding:24px}p{color:#bcb4ca;line-height:1.7}select{padding:12px;border-radius:12px;background:#292137;color:white}button{background:#9670eb;border:0;border-radius:14px;padding:14px;color:white;cursor:pointer}</style><main><b>BOOK MY TICKETS</b><h1>Your next great experience starts here.</h1><p>Explore approved movies and events. Use the BOOK MY TICKETS Android app to sign in, select seats and book tickets.</p><select id="city" aria-label="City"><option value="">All cities</option></select><h2>Explore what’s on</h2><p id="message">Loading experiences…</p><section id="catalog"></section></main><script>const city=document.getElementById('city'),catalog=document.getElementById('catalog'),message=document.getElementById('message');async function load(){try{const r=await fetch('/api/public/resources?kind=content'+(city.value?'&cityId='+encodeURIComponent(city.value):''));if(!r.ok)throw Error();const rows=await r.json();catalog.replaceChildren();message.textContent=rows.length?'':'No experiences listed yet. Check back soon.';for(const row of rows){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=row.name;p.textContent=row.data.description;a.append(h,p);catalog.append(a)}}catch{message.textContent='Experiences are temporarily unavailable. Please try again.'}}fetch('/api/public/resources?kind=location').then(r=>r.json()).then(rows=>rows.forEach(row=>{const o=document.createElement('option');o.value=row.id;o.textContent=row.name;city.append(o)})).catch(()=>{});city.onchange=load;load();</script></html>
